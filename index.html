<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabacaria Livre Head Shop</title>
<script src="config.js"></script>
<script src="supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabacaria Livre">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b19;--mu:#6f6c66;--ac:#0f766e;--ac2:#fff;--bd:#e3e0d9;--rd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f1efea;--mu:#a09c93;--ac:#2dd4bf;--ac2:#04211d;--bd:#33322e;--rd:#f97066}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f1efea;--mu:#a09c93;--ac:#2dd4bf;--ac2:#04211d;--bd:#33322e;--rd:#f97066}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
:root{--bgop:.32;--cardop:30%;--inop:50%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(logo-bg.webp) center 42%/min(94vw,640px) auto no-repeat;opacity:var(--bgop)}
main{position:relative;z-index:1;text-shadow:0 0 5px var(--bg),0 0 2px var(--bg)}
button.pri,button.on{text-shadow:none}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
button,input,textarea,select{font:inherit;color:var(--tx)}
button{background:color-mix(in srgb,var(--card) var(--inop),transparent);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
button.dng{color:var(--rd)}
input,textarea,select{background:color-mix(in srgb,var(--card) var(--inop),transparent);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.card{background:color-mix(in srgb,var(--card) var(--cardop),transparent);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:14px}
.big{font-size:22px;font-weight:700}
.sp{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:6px 10px;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat div{background:color-mix(in srgb,var(--card) var(--cardop),transparent);border:1px solid var(--bd);border-radius:12px;padding:10px}
.item{padding:6px 0;border-top:1px solid var(--bd)}
.q{width:auto;padding:4px 10px}
.sc{overflow-x:auto}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"\25BE";float:right;color:var(--mu)}
details.card[open] summary::after{content:"\25B4"}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;z-index:60;display:none;max-width:90vw;text-align:center;font-size:15px}
.lg{display:block;margin:0 auto;width:min(68vw,280px);height:auto;border-radius:22px;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 5px;text-align:right;border-top:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;border-top:0}
</style>
</head>
<body>
<main>
<h1 id="ttl">Tabacaria Livre Head Shop</h1>
<div class="row sp mu" id="who" style="margin-bottom:8px"></div>
<button id="inst" class="pri" hidden style="width:100%;margin-bottom:8px">Instalar aplicativo</button>
<div class="mu" id="sst" style="margin-bottom:6px"></div>
<div id="simb"></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<input type="file" id="cbfile" accept="image/*" hidden>
<div id="toast"></div>
<p class="mu">Os dados ficam salvos apenas neste aparelho e navegador.</p>
</main>
<script>
var K='comanda_v1',S,view='abertas',sel=null;
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}
return{c:[],cats:[{id:'bebidas',n:'Bebidas'},{id:'comidas',n:'Comidas'}],cat:[{n:'Cerveja',p:10,c:'bebidas'},{n:'Refrigerante',p:6,c:'bebidas'},{n:'Água',p:4,c:'bebidas'},{n:'Porção',p:30,c:'comidas'}]}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof schedSync==='function')schedSync()}
var lastCat=null,paying=false,FP={din:'Dinheiro',pix:'Pix',car:'Cartão'};
function migr(){if(!S.sai)S.sai=[];if(!S.cats||!S.cats.length)S.cats=[{id:'geral',n:'Geral'}];S.cat.forEach(function(i){if(!i.c||!S.cats.some(function(x){return x.id===i.c}))i.c=S.cats[0].id});S.cat.forEach(function(i){if(!i.id){var b='i'+(hs(i.n+'|'+i.c)>>>0).toString(36),id=b,n=1;while(S.cat.some(function(x){return x.id===id}))id=b+'_'+(++n);i.id=id}})}
S=load();migr();
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function hora(t){return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function sub(c){return c.itens.reduce(function(a,i){return a+i.p*i.q},0)}
function descv(c){if(!c.d||!c.d.n)return 0;var s=sub(c),v=c.d.t==='p'?s*c.d.n/100:c.d.n;return Math.round(Math.min(Math.max(v,0),s)*100)/100}
function total(c){return sub(c)-descv(c)}
function find(id){return S.c.filter(function(c){return c.id===id})[0]}
function num(v){v=String(v).trim();if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0}

var UK='comanda_users_v1',SK='comanda_sess',U,cur=null,fails=0,lockUntil=0;
function loadU(){try{var r=localStorage.getItem(UK);if(r)return JSON.parse(r)}catch(e){}return{users:[]}}
function saveU(){try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}}
U=loadU();
try{var sid=sessionStorage.getItem(SK);cur=U.users.filter(function(u){return u.id===sid})[0]||null}catch(e){}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function hashPw(pw,salt){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256)}).then(hex)}
function newSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a)}
function amsg(t){var m=$('amsg');if(m)m.textContent=t}
function val(i){var e=$(i);return e?e.value:''}
function setSess(u){cur=u;try{if(u)sessionStorage.setItem(SK,u.id);else sessionStorage.removeItem(SK)}catch(e){}}
function fail(){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}amsg('Usuário ou senha incorretos.')}
function authView(){
  if(CLOUD)return cloudAuth();
  if(!U.users.length)return '<div class="card"><b>Criar acesso</b><p class="mu">Primeiro acesso: crie o administrador do painel.</p><input id="a_n" placeholder="Seu nome" autocomplete="username"><input id="a_p" type="password" placeholder="Senha ou PIN (mín. 4)" style="margin-top:8px" autocomplete="new-password"><input id="a_p2" type="password" placeholder="Repita a senha" style="margin-top:8px" autocomplete="new-password"><button class="pri" style="width:100%;margin-top:10px" data-act="criar">Criar e entrar</button><p class="mu" id="amsg"></p></div>';
  return '<div class="card"><b>Entrar no painel</b><input id="a_n" placeholder="Usuário" style="margin-top:10px" autocomplete="username"><input id="a_p" type="password" placeholder="Senha" style="margin-top:8px" autocomplete="current-password"><button class="pri" style="width:100%;margin-top:10px" data-act="entrar">Entrar</button><p class="mu" id="amsg"></p><button class="q" data-act="esqueci">Esqueci a senha</button></div>';
}
function conta(){
  if(CLOUD)return contaCloud();
  var h='<div class="card"><b>Trocar minha senha</b><input id="c_a" type="password" placeholder="Senha atual" style="margin-top:10px"><input id="c_n" type="password" placeholder="Nova senha (mín. 4)" style="margin-top:8px"><button class="pri" style="margin-top:8px" data-act="trocar">Salvar nova senha</button></div>';
  if(cur.admin)h+='<div class="card"><b>Usuários</b>'+U.users.map(function(u){return '<div class="item row sp"><span>'+esc(u.nome)+(u.admin?' <span class="mu">(admin)</span>':'')+'</span>'+(u.id===cur.id?'':'<button class="q dng" data-act="rmu" data-id="'+u.id+'">×</button>')+'</div>'}).join('')+'<div class="row" style="margin-top:10px"><input id="u_n" placeholder="Nome"><input id="u_p" type="password" placeholder="Senha"><button class="pri" data-act="addu">+</button></div></div>';
  return h+'<p class="mu" id="amsg"></p>';
}
function authAct(a,b){
  if(CLOUD){
    if(a==='centrar'){var em=val('a_n').trim(),pw0=val('a_p');if(!em||!pw0){amsg('Informe e-mail e senha.');return true}amsg('Entrando...');sb.auth.signInWithPassword({email:em,password:pw0}).then(function(r){if(r.error)amsg('E-mail ou senha incorretos.');else onAuth(r.data.session)});return true}
    if(a==='ccriar'){var em2=val('a_n').trim(),pw2=val('a_p');if(!em2||pw2.length<6){amsg('Informe o e-mail e uma senha de pelo menos 6 caracteres.');return true}sb.auth.signUp({email:em2,password:pw2}).then(function(r){if(r.error)amsg(r.error.message);else if(r.data.session)onAuth(r.data.session);else amsg('Conta criada. Se o Supabase pedir, confirme pelo link do e-mail. Depois, aguarde o administrador aprovar.')});return true}
    if(a==='cesqueci'){var em3=val('a_n').trim();if(!em3){amsg('Digite seu e-mail acima.');return true}sb.auth.resetPasswordForEmail(em3,{redirectTo:location.origin+location.pathname}).then(function(r){amsg(r.error?r.error.message:'Enviamos um link para redefinir a senha.')});return true}
    if(a==='sair'){try{localStorage.removeItem('comanda_login_v1')}catch(e){}sb.auth.signOut();cur=null;wait=null;SIMC=null;view='abertas';sel=null;setStat('');render();return true}
    if(a==='syncnow'){sync();return true}
    if(a==='simset'){if(!cur||cur.cargo!=='desenvolvedor')return true;SIMC=b.dataset.c==='real'?null:b.dataset.c;render();return true}
    if(a==='simx'){SIMC=null;render();return true}
    if(a==='sim1'){simOne();return true}
    if(a==='simall'){simAll();return true}
    if(a==='cverif'){sb.auth.getSession().then(function(r){if(r.data&&r.data.session)onAuth(r.data.session)});return true}
    if(a==='tab'&&b.dataset.v==='admin'&&cur&&cur.admin){loadPF().then(function(){if(view==='admin')render()}).catch(function(){})}
    if(a==='adrefresh'){loadPF().then(function(){render()}).catch(function(){});return true}
    if(a==='adst'||a==='adpap'){
      if(!cur||!cur.admin)return true;
      if(SIMC){alert('Modo simulação: nenhuma alteração real foi feita. Use a aba Teste para testar as regras.');return true}
      if((b.dataset.v==='recusado'||b.dataset.v==='0')&&!confirm('Confirmar esta alteração?'))return true;
      var rp=sb.rpc('admin_status',{alvo:b.dataset.id,novo:b.dataset.v});
      rp.then(function(r){if(r.error)alert(r.error.message);return loadPF()}).then(function(){render()}).catch(function(){});
      return true}
    if(a==='csenha'){var np=val('c_n');if(np.length<6){amsg('A senha precisa ter ao menos 6 caracteres.');return true}sb.auth.updateUser({password:np}).then(function(r){amsg(r.error?r.error.message:'Senha alterada.')});return true}
  }
  if(a==='criar'){var n=val('a_n').trim(),p=val('a_p');
    if(!n){amsg('Informe um nome.');return true}
    if(p.length<4){amsg('A senha precisa ter ao menos 4 caracteres.');return true}
    if(p!==val('a_p2')){amsg('As senhas não conferem.');return true}
    var salt=newSalt();hashPw(p,salt).then(function(h){var u={id:Date.now().toString(36),nome:n,salt:salt,hash:h,admin:true};U.users.push(u);saveU();setSess(u);render()});return true}
  if(a==='entrar'){
    if(Date.now()<lockUntil){amsg('Muitas tentativas. Aguarde 30 segundos.');return true}
    var nm=val('a_n').trim().toLowerCase(),pw=val('a_p');
    var u2=U.users.filter(function(x){return x.nome.toLowerCase()===nm})[0];
    if(!u2){fail();return true}
    hashPw(pw,u2.salt).then(function(h){if(h===u2.hash){fails=0;setSess(u2);render()}else fail()});return true}
  if(a==='esqueci'){if(!confirm('Para redefinir o acesso é preciso apagar TODAS as comandas, itens e usuários deste aparelho. Continuar?'))return true;try{localStorage.removeItem(UK);localStorage.removeItem(K)}catch(e){}U={users:[]};S=load();migr();setSess(null);render();return true}
  if(a==='sair'){setSess(null);view='abertas';sel=null;render();return true}
  if(a==='trocar'){var cn=val('c_n'),ca=val('c_a');if(cn.length<4){amsg('A nova senha precisa ter ao menos 4 caracteres.');return true}
    hashPw(ca,cur.salt).then(function(h){if(h!==cur.hash){amsg('Senha atual incorreta.');return}var s2=newSalt();return hashPw(cn,s2).then(function(h2){cur.salt=s2;cur.hash=h2;saveU();render();amsg('Senha alterada.')})});return true}
  if(a==='addu'){if(!cur||!cur.admin)return true;var n2=val('u_n').trim(),p2=val('u_p');
    if(!n2||p2.length<4){amsg('Informe nome e senha (mín. 4).');return true}
    if(U.users.some(function(x){return x.nome.toLowerCase()===n2.toLowerCase()})){amsg('Esse nome já existe.');return true}
    var s3=newSalt();hashPw(p2,s3).then(function(h){U.users.push({id:Date.now().toString(36),nome:n2,salt:s3,hash:h,admin:false});saveU();render();amsg('Usuário criado.')});return true}
  if(a==='rmu'){if(!cur||!cur.admin||b.dataset.id===cur.id)return true;if(!confirm('Remover este usuário?'))return true;U.users=U.users.filter(function(x){return x.id!==b.dataset.id});saveU();render();return true}
  return false;
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('a_')===0){var b=document.querySelector('[data-act="criar"],[data-act="entrar"],[data-act="centrar"]');if(b)b.click()}});

function render(){
  if(!cur){$('simb').innerHTML='';$('ttl').style.display='none';$('who').innerHTML='';$('tabs').innerHTML='';$('app').innerHTML=authView();return}
  $('ttl').style.display='';
  $('who').innerHTML='<span>Olá, '+esc(cur.nome)+'</span><button class="q" data-act="sair">Sair</button>';
  var T=[['abertas','Abertas'],['fechadas','Fechadas'],['caixa','Caixa'],['fluxo','Fluxo'],['itens','Itens'],['leitor','Leitor'],['backup','Backup'],['conta','Conta']];
  if(CLOUD){T=applyRole(T,ecargo());if(cur.cargo==='desenvolvedor')T.push(['teste','Teste'])}
  $('simb').innerHTML=(CLOUD&&SIMC&&cur.cargo==='desenvolvedor')?'<div class="card" style="border-color:var(--ac)">🧪 <b>Simulando: '+CARGOS[SIMC]+'</b>. Nenhuma alteração real de equipe será feita. <button class="q" data-act="simx">Sair da simulação</button></div>':'';
  if(CLOUD&&!T.some(function(t){return t[0]===view}))view='abertas';
  $('tabs').innerHTML=T.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(view===t[0]&&!sel?'on':'')+'">'+t[1]+'</button>'}).join('');
  var h='';
  if(sel&&find(sel))h=detail(find(sel));
  else{sel=null;h=view==='abertas'?lista(false):view==='fechadas'?lista(true):view==='itens'?itens():view==='caixa'?caixa():view==='fluxo'?fluxo():view==='admin'?adminView():view==='teste'?testeView():view==='leitor'?leitorView():view==='conta'?bgCard()+updCard()+conta():backup()}
  $('app').innerHTML=h;
}

function lista(fech){
  var cs=S.c.filter(function(c){return !!c.saida===fech}).sort(function(a,b){return fech?b.saida-a.saida:b.entrada-a.entrada});
  var h='';
  if(!fech){
    var ab=S.c.filter(function(c){return !c.saida});
    var abT=ab.reduce(function(a,c){return a+total(c)},0);
    var hoje=new Date().toDateString();
    var fT=S.c.filter(function(c){return c.saida&&new Date(c.saida).toDateString()===hoje}).reduce(function(a,c){return a+total(c)},0);
    h+='<div class="stat"><div><span class="mu">Abertas</span><div class="big">'+ab.length+'</div><span class="mu">'+money(abT)+'</span></div><div><span class="mu">Recebido hoje</span><div class="big">'+money(fT)+'</div></div></div>';
    h+='<div class="row" style="margin-bottom:12px"><input id="nn" placeholder="Número ou nome (ex.: 12, Ana)"><button class="pri" data-act="nova">Dar entrada</button></div>';
  }
  if(!cs.length)h+='<p class="mu">Nenhuma comanda '+(fech?'fechada':'aberta')+'.</p>';
  h+=cs.map(function(c){return '<div class="card" data-act="abrir" data-id="'+c.id+'"><div class="row sp"><b>'+esc(c.nome)+'</b><span class="big">'+money(total(c))+'</span></div><div class="mu">Entrada '+hora(c.entrada)+(c.saida?' · Saída '+hora(c.saida)+(c.pg?' · '+FP[c.pg]:''):'')+' · '+c.itens.length+' item(ns)</div></div>'}).join('');
  return h;
}

function detail(c){
  var open=!c.saida,h='<button data-act="voltar">← Voltar</button>';
  h+='<div class="card" style="margin-top:10px"><div class="row sp"><b class="big">'+esc(c.nome)+'</b><span class="big">'+money(total(c))+'</span></div><div class="mu">Entrada '+hora(c.entrada)+(c.saida?' · Saída '+hora(c.saida)+(c.pg?' · Pago em '+FP[c.pg]+(c.rec?' · Recebido '+money(c.rec)+' · Troco '+money(c.rec-total(c)):''):''):'')+'</div>';
  if(!c.itens.length)h+='<p class="mu">Sem consumo ainda.</p>';
  h+=c.itens.map(function(i,k){return '<div class="item row sp"><span>'+esc(i.n)+' <span class="mu">'+money(i.p)+'</span></span><span class="row">'+(open?'<button class="q" data-act="menos" data-k="'+k+'">−</button>':'')+'<b>'+i.q+'</b>'+(open?'<button class="q" data-act="mais" data-k="'+k+'">+</button>':'')+'</span></div>'}).join('');
  if(descv(c)>0)h+='<div class="item row sp mu"><span>Subtotal</span><span>'+money(sub(c))+'</span></div><div class="item row sp"><span>Desconto</span><b>−'+money(descv(c))+'</b></div>';
  h+='</div>';
  if(open){
    if(paying)h+=payView(c);
    else{
      h+='<button class="pri" style="width:100%;margin-bottom:8px" data-act="saida">Dar saída e fechar ('+money(total(c))+')</button>';
      h+=avulsoCard()+descCard(c)+scanCard();
    }
    h+=catCard();
  }else h+='<div class="card"><b>Forma de pagamento</b><div class="row" style="margin-top:8px">'+['pix','car','din'].map(function(m){return '<button class="'+(c.pg===m?'pri':'')+'" style="flex:1" data-act="setpg" data-m="'+m+'">'+FP[m]+'</button>'}).join('')+'</div></div><button style="width:100%;margin-bottom:8px" data-act="reabrir">Reabrir comanda</button>';
  h+='<button class="dng" style="width:100%" data-act="excluir">Excluir comanda</button>';
  return h;
}

function payView(c){
  return paying==='din'?cashView(c):'<div class="card"><b>Forma de pagamento</b><p class="mu">Total '+money(total(c))+'</p><div class="row"><button class="pri" style="flex:1" data-act="pagar" data-m="pix">Pix</button><button class="pri" style="flex:1" data-act="pagar" data-m="car">Cartão</button><button class="pri" style="flex:1" data-act="cash">Dinheiro</button></div><button style="width:100%;margin-top:8px" data-act="cancpag">Cancelar</button></div>';
}
function avulsoCard(){
  return '<details class="card"><summary><b>Item avulso</b></summary><div class="row" style="margin-top:8px"><input id="cn" placeholder="Nome do item"><input id="cp" inputmode="decimal" placeholder="Preço" style="max-width:100px"><button class="pri" data-act="avulso">+</button></div></details>';
}
function catCard(){

var RANK={desenvolvedor:4,dono:3,gerente:2,funcionario:1},CARGOS={desenvolvedor:'Desenvolvedor',dono:'Dono',gerente:'Gerente',funcionario:'Funcionário'};
function cargoOf(p){return p&&p.cargo&&RANK[p.cargo]?p.cargo:(p&&p.is_admin?'dono':'funcionario')}
var SIMC=null;
function ecargo(){return cur?((SIMC&&cur.cargo==='desenvolvedor')?SIMC:cur.cargo):'funcionario'}
function RK(){return RANK[ecargo()]||1}
function mkCur(id,email,p){var c=cargoOf(p);return{id:id,nome:email,cargo:c,admin:RANK[c]>=2}}

function BASET(){return [['abertas','Abertas'],['fechadas','Fechadas'],['caixa','Caixa'],['fluxo','Fluxo'],['itens','Itens'],['leitor','Leitor'],['backup','Backup'],['conta','Conta']]}
function applyRole(T,c){
  var r=RANK[c]||1;
  if(r<3)T=T.filter(function(t){return t[0]!=='backup'});
  if(r<2)T=T.filter(function(t){return t[0]!=='fluxo'});
  if(r>=2)T=T.concat([['admin','Admin'+(PF.pend?' ('+PF.pend+')':'')]]);
  return T;
}

var FU=[{k:'D',n:'Dev Teste',c:'desenvolvedor',s:'aprovado'},{k:'O',n:'Dono Teste',c:'dono',s:'aprovado'},{k:'G',n:'Gerente Teste',c:'gerente',s:'aprovado'},{k:'F',n:'Funcionário Teste',c:'funcionario',s:'aprovado'},{k:'N',n:'Novo cadastro (pendente)',c:'funcionario',s:'pendente'}];
var FA=[['aprovar','Aprovar cadastro'],['bloquear','Bloquear / recusar'],['c:funcionario','Mudar cargo para Funcionário'],['c:gerente','Mudar cargo para Gerente'],['c:dono','Mudar cargo para Dono'],['c:desenvolvedor','Mudar cargo para Desenvolvedor']];
var CASES=[
 ['F','aprovar','N',0],['F','bloquear','G',0],['F','c:gerente','N',0],
 ['G','aprovar','N',1],['G','bloquear','F',1],['G','bloquear','G',0],['G','bloquear','O',0],['G','bloquear','D',0],['G','c:gerente','F',0],
 ['O','aprovar','N',1],['O','bloquear','F',1],['O','bloquear','G',1],['O','bloquear','D',0],['O','bloquear','O',0],['O','c:gerente','F',1],['O','c:funcionario','G',1],['O','c:dono','F',0],['O','c:funcionario','D',0],['O','c:gerente','N',0],
 ['D','bloquear','O',1],['D','c:dono','F',1],['D','c:funcionario','O',1],['D','c:funcionario','D',0],['D','bloquear','D',0],['D','c:desenvolvedor','F',1]
];
var VIS={funcionario:{fluxo:0,backup:0,admin:0},gerente:{fluxo:1,backup:0,admin:1},dono:{fluxo:1,backup:1,admin:1},desenvolvedor:{fluxo:1,backup:1,admin:1}};
function fu(k){return FU.filter(function(x){return x.k===k})[0]}
function actName(k){return FA.filter(function(x){return x[0]===k})[0][1]}
function runCase(ak,act,tk){
  var A=fu(ak),T=fu(tk),mesmo=ak===tk,p;
  if(act==='aprovar'||act==='bloquear')p=sb.rpc('regra_status',{meu:A.c,alvo_cargo:T.c,novo:act==='aprovar'?'aprovado':'recusado',mesmo:mesmo});
  else p=sb.rpc('regra_cargo',{meu:A.c,alvo_cargo:T.c,novo_cargo:act.slice(2),status_alvo:T.s,mesmo:mesmo});
  return p.then(function(r){
    if(r.error)return{ok:null,msg:'Erro ao consultar o servidor ('+r.error.message+'). Rode o supabase.sql atualizado.'};
    return{ok:r.data===null,msg:r.data};
  },function(){return{ok:null,msg:'Sem conexão com o servidor.'}});
}
function simOne(){
  var r=$('simr');if(!r)return;
  r.textContent='Consultando o servidor...';
  runCase($('st_a').value,$('st_k').value,$('st_t').value).then(function(x){
    r.innerHTML=x.ok===null?'⚠️ '+esc(x.msg):(x.ok?'✅ <b>Permitido</b>':'❌ <b>Negado:</b> '+esc(x.msg));
  });
}
function simAll(){
  var el=$('simall');if(!el)return;
  el.textContent='Rodando os testes no servidor...';
  var rows=[],okc=0,i=0,erro=false;
  function next(){
    if(i>=CASES.length)return Promise.resolve();
    var c=CASES[i++];
    return runCase(c[0],c[1],c[2]).then(function(x){
      var exp=!!c[3],pass=(x.ok===exp);
      if(x.ok===null)erro=true;
      if(pass)okc++;
      rows.push('<tr><td>'+esc(fu(c[0]).n)+'</td><td>'+esc(actName(c[1]))+'</td><td>'+esc(fu(c[2]).n)+'</td><td>'+(exp?'Permitir':'Negar')+'</td><td>'+(x.ok===null?'erro':(x.ok?'Permitiu':'Negou'))+'</td><td>'+(pass?'✅':'❌')+'</td></tr>');
    }).then(next);
  }
  next().then(function(){
    var vt=0,vo=0,vrows=[];
    Object.keys(VIS).forEach(function(c){
      var names=applyRole(BASET(),c).map(function(t){return t[0]});
      ['fluxo','backup','admin'].forEach(function(n){
        var got=names.indexOf(n)>-1?1:0,pass=got===VIS[c][n];vt++;if(pass)vo++;
        vrows.push('<tr><td>'+CARGOS[c]+'</td><td>Tela '+n+'</td><td></td><td>'+(VIS[c][n]?'Mostrar':'Esconder')+'</td><td>'+(got?'Mostrou':'Escondeu')+'</td><td>'+(pass?'✅':'❌')+'</td></tr>');
      });
    });
    var all=(okc===CASES.length&&vo===vt);
    el.innerHTML=(erro?'<p>⚠️ O servidor não respondeu como esperado. Rode o <b>supabase.sql</b> atualizado e tente de novo.</p>':'')+'<p><b>'+(all?'✅ Tudo certo':'❌ Há diferenças')+'</b><br>Regras no servidor: '+okc+' de '+CASES.length+'<br>Telas por cargo: '+vo+' de '+vt+'</p><div class="sc"><table><tr><th>Quem</th><th>Ação</th><th>Alvo</th><th>Esperado</th><th>Resultado</th><th></th></tr>'+rows.join('')+vrows.join('')+'</table></div>';
  });
}

async function pull(){
  var rows=[],from=0,first=!SY.since;
  var sd=SY.since?new Date(new Date(SY.since).getTime()-60000).toISOString():null;
  for(;;){
    var q=sb.from('registros').select('tipo,id,dados,apagado,atualizado_em').order('atualizado_em',{ascending:true}).order('id',{ascending:true}).range(from,from+999);
    if(sd)q=q.gte('atualizado_em',sd);
    var r=await q;if(r.error)throw r.error;
    rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000;
  }
  if(first&&rows.length&&!S.c.length&&!S.sai.length){S.cat=[];S.cats=[]}
  var L=flat(),ch=false;
  rows.forEach(function(x){
    var k=x.tipo+':'+x.id,l=L[k],m=SY.m[k];
    if(!SY.since||x.atualizado_em>SY.since)SY.since=x.atualizado_em;
    if(l&&(m===undefined||hs(sj(l))!==m))return;
    if(x.apagado){if(l){upLocal(x.tipo,x.id,null);ch=true}delete SY.m[k];return}
    if(!l&&m!==undefined)return; // exclusao feita aqui e ainda nao enviada: vale a exclusao
    var h=hs(sj(x.dados));
    if(!l||hs(sj(l))!==h){upLocal(x.tipo,x.id,x.dados);ch=true}
    SY.m[k]=h;
  });
  return ch;
}
async function push(){
  var L=flat(),up=[];
  Object.keys(L).forEach(function(k){var h=hs(sj(L[k]));if(SY.m[k]!==h)up.push({k:k,tipo:k[0],id:k.slice(2),dados:L[k],apagado:false,h:h})});
  Object.keys(SY.m).forEach(function(k){if(!L[k])up.push({k:k,tipo:k[0],id:k.slice(2),dados:{},apagado:true})});
  for(var i=0;i<up.length;i+=200){
    var ch=up.slice(i,i+200);
    var r=await sb.from('registros').upsert(ch.map(function(x){return{user_id:SY.uid,tipo:x.tipo,id:x.id,dados:x.dados,apagado:x.apagado}}),{onConflict:'tipo,id'});
    if(r.error)throw r.error;
    ch.forEach(function(x){if(x.apagado)delete SY.m[x.k];else SY.m[x.k]=x.h});
  }
}
async function sync(){
  if(!CLOUD||!cur||!SY.uid)return;
  if(!navigator.onLine){setStat('Offline: dados salvos no aparelho');return}
  if(syncing){syncAgain=true;return}
  syncing=true;setStat('Sincronizando...');
  try{
    var ss=await sb.auth.getSession();
    if(!ss.data.session){
      if(isNetErr(ss.error))throw ss.error;
      try{localStorage.removeItem('comanda_login_v1')}catch(e3){}
      cur=null;wait=null;syncing=false;setStat('');render();return;
    }
    var pf=await checkPerfil();
    if(!pf||pf.status!=='aprovado'){wait=pf?pf.status:'pendente';cur=null;syncing=false;setStat('');render();return}
    cur.cargo=cargoOf(pf);cur.admin=(RANK[cur.cargo]||1)>=2;cachePerfil(SY.uid,pf);
    migr();
    var ch=await pull();
    if(cur.admin){var pb=PF.pend;try{await loadPF()}catch(e2){}if(PF.pend!==pb)ch=true}
    await push();
    saveLocal();saveSY();
    setStat('Sincronizado \u00e0s '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    if(ch)softRender();
  }catch(e){setStat('Sem conex\u00e3o com a nuvem: dados salvos no aparelho')}
  syncing=false;
  if(syncAgain){syncAgain=false;schedSync()}
}
function schedSync(){if(!CLOUD)return;clearTimeout(stimer);stimer=setTimeout(sync,1500)}
function savedLogin(){try{return JSON.parse(localStorage.getItem('comanda_login_v1'))}catch(e){return null}}
function isNetErr(e){return !!e&&/Retryable|fetch|network/i.test(String(e.name)+' '+String(e.message))}
function offlineBoot(err){
  var l=savedLogin(),p=l&&cachedPerfil(l.uid);
  booting=false;
  if(l&&p&&p.status==='aprovado'&&(!navigator.onLine||isNetErr(err))){
    SY.uid=l.uid;cur=mkCur(l.uid,l.email,p);
    render();setStat('Offline: dados salvos no aparelho');return;
  }
  render();
}
function onAuth(s){
  if(!s)return;
  SY.uid=s.user.id;saveSY();
  try{localStorage.setItem('comanda_login_v1',JSON.stringify({uid:s.user.id,email:s.user.email}))}catch(e){}
  sb.from('perfis').select('status,cargo,is_admin').eq('id',s.user.id).maybeSingle().then(function(r){
    var p=r.data;
    if(r.error)p=cachedPerfil(s.user.id);else cachePerfil(s.user.id,p);
    booting=false;
    if(p&&p.status==='aprovado'){wait=null;cur=mkCur(s.user.id,s.user.email,p);render();sync()}
    else{wait=p?p.status:'pendente';cur=null;render()}
  }).catch(function(){booting=false;wait='pendente';cur=null;render()});
}

function norm(c){return String(c||'').trim().replace(/^0+/,'')}
function findCb(code){var n=norm(code);if(!n)return null;return S.cat.filter(function(i){return i.cb&&norm(i.cb)===n})[0]||null}
function addItem(c,it){var x=c.itens.filter(function(i){return i.n===it.n&&i.p===it.p})[0];if(x)x.q++;else c.itens.push({n:it.n,p:it.p,q:1})}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2200)}
function beep(){if(!SC.sound)return;try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=1000;o.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close()},90)}catch(e){}}
function scanCard(){
  return '<div class="card"><b>C\u00f3digo de barras</b><div class="row" style="margin-top:8px"><input id="cbin" inputmode="numeric" placeholder="Passe o leitor ou digite o c\u00f3digo"><button class="pri" data-act="cbgo">Ok</button></div><div class="row" style="margin-top:8px"><button style="flex:1" data-act="scancam">\U0001F4F7 C\u00e2mera</button><button style="flex:1" data-act="scanfoto">Foto</button></div></div>';
}
function onCode(code,fromField){
  code=String(code||'').trim();if(!code||!cur)return;
  var it=findCb(code);
  if(view==='leitor'&&!sel){showCodeInfo(code);return}
  if(view==='itens'&&!sel){
    if(it){toast('J\u00e1 cadastrado: '+it.n);beep();return}
    var ib=$('ib');
    if(ib){ib.value=code;var nm=$('in');if(nm)nm.focus();toast('C\u00f3digo lido: '+code);beep()}
    return;
  }
  var c=sel&&find(sel);
  if(!c||c.saida){toast('Abra uma comanda para ler produtos');return}
  beep();
  if(!it){
    if(!confirm('O c\u00f3digo '+code+' ainda n\u00e3o est\u00e1 cadastrado. Cadastrar este produto agora?'))return;
    var nm2=prompt('Nome do produto');if(!nm2||!nm2.trim())return;
    var pr=prompt('Pre\u00e7o (R$)');if(pr===null)return;
    var gn=prompt('Categoria ('+S.cats.map(function(x){return x.n}).join(', ')+')',S.cats[0].n);
    var g=S.cats.filter(function(x){return gn&&x.n.toLowerCase()===gn.trim().toLowerCase()})[0]||S.cats[0];
    it={n:nm2.trim(),p:num(pr),c:g.id,cb:code};S.cat.push(it);migr();
  }
  addItem(c,it);save();render();toast(it.n+' adicionado');
  if(fromField){var e=$('cbin');if(e)e.focus()}
}
/* leitor laser USB/Bluetooth (funciona como teclado) */
var SC={gap:150,min:4,end:'auto',sound:true},scanIdle=null,LT={t:[],buf:''},ltTimer=null,APPV='14nov-1';
try{var _c=JSON.parse(localStorage.getItem('comanda_scan_cfg'));if(_c)for(var _k in _c)SC[_k]=_c[_k]}catch(e){}
function saveSC(){try{localStorage.setItem('comanda_scan_cfg',JSON.stringify(SC))}catch(e){}}
function showTest(buf,endk,ts){
  var el=$('ltr');if(!el)return;
  var g=[];for(var i=1;i<ts.length;i++)g.push(ts[i]-ts[i-1]);
  var avg=g.length?Math.round(g.reduce(function(a,b){return a+b},0)/g.length):0,mx=g.length?Math.max.apply(null,g):0;
  var it=findCb(buf),rec=Math.max(150,Math.round(mx*2));
  el.innerHTML='<div>Código lido: <b>'+esc(buf)+'</b> ('+buf.length+' caracteres)</div><div>Tecla final: <b>'+esc(endk)+'</b></div>'+(g.length?'<div>Velocidade: média '+avg+' ms entre teclas (máx. '+mx+' ms)</div>':'')+'<div>Produto: <b>'+(it?esc(it.n):'ainda não cadastrado')+'</b></div><button class="q" style="margin-top:8px" data-act="ltapply" data-gap="'+rec+'" data-end="'+(endk==='nenhuma'?'time':'auto')+'" data-len="'+Math.max(3,Math.min(buf.length,SC.min))+'">Aplicar ajustes recomendados</button>';
  beep();
}
function showCodeInfo(code){var el=$('ltr');if(!el)return;var it=findCb(code);el.innerHTML='<div>Código lido: <b>'+esc(code)+'</b></div><div>Produto: <b>'+(it?esc(it.n):'ainda não cadastrado')+'</b></div>';beep()}
function testKey(e){
  if(e.key==='Enter'||e.key==='Tab'){
    e.preventDefault();clearTimeout(ltTimer);
    if(LT.buf)showTest(LT.buf,e.key,LT.t);
    LT={t:[],buf:''};$('lt').value='';return;
  }
  if(e.key&&e.key.length===1){
    LT.buf+=e.key;LT.t.push(Date.now());
    clearTimeout(ltTimer);
    ltTimer=setTimeout(function(){if(LT.buf.length>=3){showTest(LT.buf,'nenhuma',LT.t);LT={t:[],buf:''};var l=$('lt');if(l)l.value=''}},600);
  }
}
function leitorView(){
  var n=S.cat.filter(function(i){return i.cb}).length;
  var opt=function(v,t){return '<option value="'+v+'"'+(SC.end===v?' selected':'')+'>'+t+'</option>'};
  return '<div class="card"><b>Leitor de código de barras</b><p class="mu">Funciona com leitor laser (USB ou Bluetooth), câmera do celular, foto ou digitação. '+n+' produto(s) com código cadastrado.</p><b>Testar o leitor</b><p class="mu">Toque no campo e passe o leitor. O app mostra o que ele envia.</p><input id="lt" inputmode="none" placeholder="Passe o leitor aqui" autocomplete="off"><div class="row" style="margin-top:8px"><button style="flex:1" data-act="scancam">\U0001F4F7 Testar câmera</button><button style="flex:1" data-act="scanfoto">Testar foto</button></div><div id="ltr" class="mu" style="margin-top:10px">Nenhuma leitura ainda.</div></div>'+
  '<div class="card"><b>Ajustes do leitor</b><p class="mu">Fim do código (tecla que o leitor envia no final)</p><select id="sc_end">'+opt('auto','Automático (Enter ou Tab)')+opt('enter','Enter')+opt('tab','Tab')+opt('time','Nenhuma (detectar por tempo)')+'</select><p class="mu">Tempo máximo entre teclas: <b id="sc_gv">'+SC.gap+' ms</b> (aumente se o leitor for lento ou antigo)</p><input id="sc_gap" type="range" min="50" max="500" step="10" value="'+SC.gap+'"><p class="mu">Tamanho mínimo do código: <b id="sc_lv">'+SC.min+'</b></p><input id="sc_min" type="range" min="3" max="14" step="1" value="'+SC.min+'"><label class="row" style="margin-top:10px"><input id="sc_snd" type="checkbox" style="width:auto"'+(SC.sound?' checked':'')+'> Tocar som ao ler</label></div>'+
  '<div class="card"><b>Como cadastrar produtos com o código</b><p class="mu">1) Vá em Itens → Novo item. 2) Toque no campo "Código de barras" e passe o leitor (ou use \U0001F4F7 / Foto). 3) Digite nome e preço e toque em Adicionar. Depois, na comanda, é só passar o leitor e o produto entra sozinho.</p><button class="pri" data-act="tab" data-v="itens">Ir para Itens</button></div>';
}
function updCard(){return '<div class="card"><b>Atualizar app</b><p class="mu">Versão: '+APPV+'. Se algo novo não apareceu, toque abaixo para baixar a versão mais recente (precisa de internet).</p><button class="pri" data-act="upd">Atualizar agora</button></div>'}
document.addEventListener('input',function(e){var id=e.target.id;
  if(id==='sc_gap'){SC.gap=+e.target.value;$('sc_gv').textContent=SC.gap+' ms';saveSC()}
  else if(id==='sc_min'){SC.min=+e.target.value;$('sc_lv').textContent=SC.min;saveSC()}});
document.addEventListener('change',function(e){var id=e.target.id;
  if(id==='sc_end'){SC.end=e.target.value;saveSC()}else if(id==='sc_snd'){SC.sound=e.target.checked;saveSC()}});
document.addEventListener('keydown',function(e){
  if(!cur)return;
  var t=e.target,id=t&&t.id,isIn=t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(isIn){
    if(id==='lt'){testKey(e);return}
    if(e.key==='Enter'&&id==='cbin'){e.preventDefault();var v=t.value;t.value='';onCode(v,true)}
    else if(e.key==='Enter'&&id==='ib'){e.preventDefault();var n=$('in');if(n)n.focus()}
    return;
  }
  var now=Date.now(),endEnter=(SC.end!=='tab'),endTab=(SC.end!=='enter');
  if((e.key==='Enter'&&endEnter)||(e.key==='Tab'&&endTab)){
    if(scanBuf.length>=SC.min){e.preventDefault();clearTimeout(scanIdle);var c=scanBuf;scanBuf='';onCode(c)}else scanBuf='';
    return;
  }
  if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(now-scanT>SC.gap)scanBuf='';
    scanBuf+=e.key;scanT=now;
    clearTimeout(scanIdle);
    if(SC.end==='time')scanIdle=setTimeout(function(){if(scanBuf.length>=SC.min){var c2=scanBuf;scanBuf='';onCode(c2)}},Math.max(60,Math.round(SC.gap/2)));
  }
});
/* camera e foto */
function getBD(){
  if(!('BarcodeDetector' in window))return Promise.resolve(null);
  return BarcodeDetector.getSupportedFormats().then(function(f){
    var w=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code'].filter(function(x){return f.indexOf(x)>-1});
    return w.length?new BarcodeDetector({formats:w}):null;
  }).catch(function(){return null});
}
function loadZX(){return new Promise(function(res,rej){if(window.ZXing)return res(window.ZXing);var s=document.createElement('script');s.src='zxing.js';s.onload=function(){res(window.ZXing)};s.onerror=rej;document.head.appendChild(s)})}
function zxDecode(cv){
  return loadZX().then(function(Z){
    var hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    var rd=new Z.MultiFormatReader();rd.setHints(hints);
    var bm=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));
    try{return rd.decode(bm).getText()}catch(e){return null}
  });
}
function decodeCanvas(cv){
  return getBD().then(function(d){
    if(!d)return zxDecode(cv);
    return d.detect(cv).then(function(r){return r.length?r[0].rawValue:null}).then(function(v){return v||zxDecode(cv)});
  });
}
function closeScan(){scanRun=false;if(scanStream){scanStream.getTracks().forEach(function(t){t.stop()});scanStream=null}var b=$('scanbox');if(b)b.remove()}
function openScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Este navegador n\u00e3o permite usar a c\u00e2mera aqui. Use o bot\u00e3o Foto.');return}
  closeScan();
  var box=document.createElement('div');box.id='scanbox';
  box.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
  box.innerHTML='<video id="scanv" playsinline muted style="width:100%;max-width:520px;border-radius:14px;background:#000"></video><div style="color:#fff;text-align:center">Aponte a c\u00e2mera para o c\u00f3digo de barras</div><button data-act="scanx" style="padding:12px 28px">Fechar</button>';
  document.body.appendChild(box);
  var v=$('scanv');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(st){
    scanStream=st;v.srcObject=st;v.play();scanRun=true;
    getBD().then(function(d){
      var cv=document.createElement('canvas');
      (function loop(){
        if(!scanRun)return;
        if(v.readyState<2){setTimeout(loop,200);return}
        var p;
        if(d)p=d.detect(v).then(function(r){return r.length?r[0].rawValue:null});
        else{cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);p=zxDecode(cv)}
        p.then(function(code){if(!scanRun)return;if(code){closeScan();onCode(code)}else setTimeout(loop,d?150:300)}).catch(function(){setTimeout(loop,400)});
      })();
    });
  }).catch(function(){closeScan();alert('N\u00e3o foi poss\u00edvel abrir a c\u00e2mera. Permita o acesso \u00e0 c\u00e2mera no navegador ou use o bot\u00e3o Foto.')});
}
function readPhoto(f){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas'),m=Math.min(1,1600/Math.max(img.width,img.height));
      cv.width=Math.round(img.width*m);cv.height=Math.round(img.height*m);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);
      decodeCanvas(cv).then(res,rej);
    };
    img.onerror=rej;img.src=URL.createObjectURL(f);
  });
}
document.addEventListener('change',function(e){
  if(e.target.id!=='cbfile')return;
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  toast('Lendo a foto...');
  readPhoto(f).then(function(code){if(code)onCode(code);else alert('N\u00e3o consegui ler o c\u00f3digo nessa foto. Chegue mais perto, com boa luz e o c\u00f3digo reto, ou digite o n\u00famero.')}).catch(function(){alert('N\u00e3o consegui ler essa foto. Tente de novo ou digite o c\u00f3digo.')});
});
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('inst').hidden=false});
$('inst').addEventListener('click',function(){if(dp){dp.prompt();dp=null;$('inst').hidden=true}});
window.addEventListener('appinstalled',function(){$('inst').hidden=true});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
render();
</script>
