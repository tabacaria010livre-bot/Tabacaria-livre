<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabacaria Livre Head Shop</title>
<script src="config.js"></script>
<script src="supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabacaria Livre">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b19;--mu:#6f6c66;--ac:#0f766e;--ac2:#fff;--bd:#e3e0d9;--rd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f1efea;--mu:#a09c93;--ac:#2dd4bf;--ac2:#04211d;--bd:#33322e;--rd:#f97066}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f1efea;--mu:#a09c93;--ac:#2dd4bf;--ac2:#04211d;--bd:#33322e;--rd:#f97066}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
:root{--bgop:.32;--cardop:30%;--inop:50%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(logo-bg.webp) center 42%/min(94vw,640px) auto no-repeat;opacity:var(--bgop)}
main{position:relative;z-index:1;text-shadow:0 0 5px var(--bg),0 0 2px var(--bg)}
button.pri,button.on{text-shadow:none}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
button,input,textarea,select{font:inherit;color:var(--tx)}
button{background:color-mix(in srgb,var(--card) var(--inop),transparent);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
button.dng{color:var(--rd)}
input,textarea,select{background:color-mix(in srgb,var(--card) var(--inop),transparent);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.card{background:color-mix(in srgb,var(--card) var(--cardop),transparent);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:14px}
.big{font-size:22px;font-weight:700}
.sp{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:6px 10px;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat div{background:color-mix(in srgb,var(--card) var(--cardop),transparent);border:1px solid var(--bd);border-radius:12px;padding:10px}
.item{padding:6px 0;border-top:1px solid var(--bd)}
.q{width:auto;padding:4px 10px}
.sc{overflow-x:auto}
.lg{display:block;margin:0 auto;width:min(68vw,280px);height:auto;border-radius:22px;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 5px;text-align:right;border-top:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;border-top:0}
</style>
</head>
<body>
<main>
<h1 id="ttl">Tabacaria Livre Head Shop</h1>
<div class="row sp mu" id="who" style="margin-bottom:8px"></div>
<button id="inst" class="pri" hidden style="width:100%;margin-bottom:8px">Instalar aplicativo</button>
<div class="mu" id="sst" style="margin-bottom:6px"></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<p class="mu">Os dados ficam salvos apenas neste aparelho e navegador.</p>
</main>
<script>
var K='comanda_v1',S,view='abertas',sel=null;
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}
return{c:[],cats:[{id:'bebidas',n:'Bebidas'},{id:'comidas',n:'Comidas'}],cat:[{n:'Cerveja',p:10,c:'bebidas'},{n:'Refrigerante',p:6,c:'bebidas'},{n:'Água',p:4,c:'bebidas'},{n:'Porção',p:30,c:'comidas'}]}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof schedSync==='function')schedSync()}
var lastCat=null,paying=false,FP={din:'Dinheiro',pix:'Pix',car:'Cartão'};
function migr(){if(!S.sai)S.sai=[];if(!S.cats||!S.cats.length)S.cats=[{id:'geral',n:'Geral'}];S.cat.forEach(function(i){if(!i.c||!S.cats.some(function(x){return x.id===i.c}))i.c=S.cats[0].id});S.cat.forEach(function(i){if(!i.id){var b='i'+(hs(i.n+'|'+i.c)>>>0).toString(36),id=b,n=1;while(S.cat.some(function(x){return x.id===id}))id=b+'_'+(++n);i.id=id}})}
S=load();migr();
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function hora(t){return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function sub(c){return c.itens.reduce(function(a,i){return a+i.p*i.q},0)}
function descv(c){if(!c.d||!c.d.n)return 0;var s=sub(c),v=c.d.t==='p'?s*c.d.n/100:c.d.n;return Math.round(Math.min(Math.max(v,0),s)*100)/100}
function total(c){return sub(c)-descv(c)}
function find(id){return S.c.filter(function(c){return c.id===id})[0]}
function num(v){v=String(v).trim();if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0}

var UK='comanda_users_v1',SK='comanda_sess',U,cur=null,fails=0,lockUntil=0;
function loadU(){try{var r=localStorage.getItem(UK);if(r)return JSON.parse(r)}catch(e){}return{users:[]}}
function saveU(){try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}}
U=loadU();
try{var sid=sessionStorage.getItem(SK);cur=U.users.filter(function(u){return u.id===sid})[0]||null}catch(e){}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function hashPw(pw,salt){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256)}).then(hex)}
function newSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a)}
function amsg(t){var m=$('amsg');if(m)m.textContent=t}
function val(i){var e=$(i);return e?e.value:''}
function setSess(u){cur=u;try{if(u)sessionStorage.setItem(SK,u.id);else sessionStorage.removeItem(SK)}catch(e){}}
function fail(){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}amsg('Usuário ou senha incorretos.')}
function authView(){
  if(CLOUD)return cloudAuth();
  if(!U.users.length)return '<div class="card"><b>Criar acesso</b><p class="mu">Primeiro acesso: crie o administrador do painel.</p><input id="a_n" placeholder="Seu nome" autocomplete="username"><input id="a_p" type="password" placeholder="Senha ou PIN (mín. 4)" style="margin-top:8px" autocomplete="new-password"><input id="a_p2" type="password" placeholder="Repita a senha" style="margin-top:8px" autocomplete="new-password"><button class="pri" style="width:100%;margin-top:10px" data-act="criar">Criar e entrar</button><p class="mu" id="amsg"></p></div>';
  return '<div class="card"><b>Entrar no painel</b><input id="a_n" placeholder="Usuário" style="margin-top:10px" autocomplete="username"><input id="a_p" type="password" placeholder="Senha" style="margin-top:8px" autocomplete="current-password"><button class="pri" style="width:100%;margin-top:10px" data-act="entrar">Entrar</button><p class="mu" id="amsg"></p><button class="q" data-act="esqueci">Esqueci a senha</button></div>';
}
function conta(){
  if(CLOUD)return contaCloud();
  var h='<div class="card"><b>Trocar minha senha</b><input id="c_a" type="password" placeholder="Senha atual" style="margin-top:10px"><input id="c_n" type="password" placeholder="Nova senha (mín. 4)" style="margin-top:8px"><button class="pri" style="margin-top:8px" data-act="trocar">Salvar nova senha</button></div>';
  if(cur.admin)h+='<div class="card"><b>Usuários</b>'+U.users.map(function(u){return '<div class="item row sp"><span>'+esc(u.nome)+(u.admin?' <span class="mu">(admin)</span>':'')+'</span>'+(u.id===cur.id?'':'<button class="q dng" data-act="rmu" data-id="'+u.id+'">×</button>')+'</div>'}).join('')+'<div class="row" style="margin-top:10px"><input id="u_n" placeholder="Nome"><input id="u_p" type="password" placeholder="Senha"><button class="pri" data-act="addu">+</button></div></div>';
  return h+'<p class="mu" id="amsg"></p>';
}
function authAct(a,b){
  if(CLOUD){
    if(a==='centrar'){var em=val('a_n').trim(),pw0=val('a_p');if(!em||!pw0){amsg('Informe e-mail e senha.');return true}amsg('Entrando...');sb.auth.signInWithPassword({email:em,password:pw0}).then(function(r){if(r.error)amsg('E-mail ou senha incorretos.');else onAuth(r.data.session)});return true}
    if(a==='ccriar'){var em2=val('a_n').trim(),pw2=val('a_p');if(!em2||pw2.length<6){amsg('Informe o e-mail e uma senha de pelo menos 6 caracteres.');return true}sb.auth.signUp({email:em2,password:pw2}).then(function(r){if(r.error)amsg(r.error.message);else if(r.data.session)onAuth(r.data.session);else amsg('Conta criada. Se o Supabase pedir, confirme pelo link do e-mail. Depois, aguarde o administrador aprovar.')});return true}
    if(a==='cesqueci'){var em3=val('a_n').trim();if(!em3){amsg('Digite seu e-mail acima.');return true}sb.auth.resetPasswordForEmail(em3,{redirectTo:location.origin+location.pathname}).then(function(r){amsg(r.error?r.error.message:'Enviamos um link para redefinir a senha.')});return true}
    if(a==='sair'){try{localStorage.removeItem('comanda_login_v1')}catch(e){}sb.auth.signOut();cur=null;wait=null;view='abertas';sel=null;setStat('');render();return true}
    if(a==='syncnow'){sync();return true}
    if(a==='cverif'){sb.auth.getSession().then(function(r){if(r.data&&r.data.session)onAuth(r.data.session)});return true}
    if(a==='tab'&&b.dataset.v==='admin'&&cur&&cur.admin){loadPF().then(function(){if(view==='admin')render()}).catch(function(){})}
    if(a==='adrefresh'){loadPF().then(function(){render()}).catch(function(){});return true}
    if(a==='adst'||a==='adpap'){
      if(!cur||!cur.admin)return true;
      if((b.dataset.v==='recusado'||b.dataset.v==='0')&&!confirm('Confirmar esta alteração?'))return true;
      var rp=a==='adst'?sb.rpc('admin_status',{alvo:b.dataset.id,novo:b.dataset.v}):sb.rpc('admin_papel',{alvo:b.dataset.id,valor:b.dataset.v==='1'});
      rp.then(function(r){if(r.error)alert(r.error.message);return loadPF()}).then(function(){render()}).catch(function(){});
      return true}
    if(a==='csenha'){var np=val('c_n');if(np.length<6){amsg('A senha precisa ter ao menos 6 caracteres.');return true}sb.auth.updateUser({password:np}).then(function(r){amsg(r.error?r.error.message:'Senha alterada.')});return true}
  }
  if(a==='criar'){var n=val('a_n').trim(),p=val('a_p');
    if(!n){amsg('Informe um nome.');return true}
    if(p.length<4){amsg('A senha precisa ter ao menos 4 caracteres.');return true}
    if(p!==val('a_p2')){amsg('As senhas não conferem.');return true}
    var salt=newSalt();hashPw(p,salt).then(function(h){var u={id:Date.now().toString(36),nome:n,salt:salt,hash:h,admin:true};U.users.push(u);saveU();setSess(u);render()});return true}
  if(a==='entrar'){
    if(Date.now()<lockUntil){amsg('Muitas tentativas. Aguarde 30 segundos.');return true}
    var nm=val('a_n').trim().toLowerCase(),pw=val('a_p');
    var u2=U.users.filter(function(x){return x.nome.toLowerCase()===nm})[0];
    if(!u2){fail();return true}
    hashPw(pw,u2.salt).then(function(h){if(h===u2.hash){fails=0;setSess(u2);render()}else fail()});return true}
  if(a==='esqueci'){if(!confirm('Para redefinir o acesso é preciso apagar TODAS as comandas, itens e usuários deste aparelho. Continuar?'))return true;try{localStorage.removeItem(UK);localStorage.removeItem(K)}catch(e){}U={users:[]};S=load();migr();setSess(null);render();return true}
  if(a==='sair'){setSess(null);view='abertas';sel=null;render();return true}
  if(a==='trocar'){var cn=val('c_n'),ca=val('c_a');if(cn.length<4){amsg('A nova senha precisa ter ao menos 4 caracteres.');return true}
    hashPw(ca,cur.salt).then(function(h){if(h!==cur.hash){amsg('Senha atual incorreta.');return}var s2=newSalt();return hashPw(cn,s2).then(function(h2){cur.salt=s2;cur.hash=h2;saveU();render();amsg('Senha alterada.')})});return true}
  if(a==='addu'){if(!cur||!cur.admin)return true;var n2=val('u_n').trim(),p2=val('u_p');
    if(!n2||p2.length<4){amsg('Informe nome e senha (mín. 4).');return true}
    if(U.users.some(function(x){return x.nome.toLowerCase()===n2.toLowerCase()})){amsg('Esse nome já existe.');return true}
    var s3=newSalt();hashPw(p2,s3).then(function(h){U.users.push({id:Date.now().toString(36),nome:n2,salt:s3,hash:h,admin:false});saveU();render();amsg('Usuário criado.')});return true}
  if(a==='rmu'){if(!cur||!cur.admin||b.dataset.id===cur.id)return true;if(!confirm('Remover este usuário?'))return true;U.users=U.users.filter(function(x){return x.id!==b.dataset.id});saveU();render();return true}
  return false;
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('a_')===0){var b=document.querySelector('[data-act="criar"],[data-act="entrar"],[data-act="centrar"]');if(b)b.click()}});

function render(){
  if(!cur){$('ttl').style.display='none';$('who').innerHTML='';$('tabs').innerHTML='';$('app').innerHTML=authView();return}
  $('ttl').style.display='';
  $('who').innerHTML='<span>Olá, '+esc(cur.nome)+'</span><button class="q" data-act="sair">Sair</button>';
  var T=[['abertas','Abertas'],['fechadas','Fechadas'],['caixa','Caixa'],['fluxo','Fluxo'],['itens','Itens'],['backup','Backup'],['conta','Conta']];
  if(CLOUD&&!cur.admin)T=T.filter(function(t){return t[0]!=='backup'});
  if(CLOUD&&cur.admin)T.push(['admin','Admin'+(PF.pend?' ('+PF.pend+')':'')]);
  $('tabs').innerHTML=T.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(view===t[0]&&!sel?'on':'')+'">'+t[1]+'</button>'}).join('');
  var h='';
  if(sel&&find(sel))h=detail(find(sel));
  else{sel=null;h=view==='abertas'?lista(false):view==='fechadas'?lista(true):view==='itens'?itens():view==='caixa'?caixa():view==='fluxo'?fluxo():view==='admin'?adminView():view==='conta'?bgCard()+conta():backup()}
  $('app').innerHTML=h;
}

function lista(fech){
  var cs=S.c.filter(function(c){return !!c.saida===fech}).sort(function(a,b){return fech?b.saida-a.saida:b.entrada-a.entrada});
  var h='';
  if(!fech){
    var ab=S.c.filter(function(c){return !c.saida});
    var abT=ab.reduce(function(a,c){return a+total(c)},0);
    var hoje=new Date().toDateString();
    var fT=S.c.filter(function(c){return c.saida&&new Date(c.saida).toDateString()===hoje}).reduce(function(a,c){return a+total(c)},0);
    h+='<div class="stat"><div><span class="mu">Abertas</span><div class="big">'+ab.length+'</div><span class="mu">'+money(abT)+'</span></div><div><span class="mu">Recebido hoje</span><div class="big">'+money(fT)+'</div></div></div>';
    h+='<div class="row" style="margin-bottom:12px"><input id="nn" placeholder="Número ou nome (ex.: 12, Ana)"><button class="pri" data-act="nova">Dar entrada</button></div>';
  }
  if(!cs.length)h+='<p class="mu">Nenhuma comanda '+(fech?'fechada':'aberta')+'.</p>';
  h+=cs.map(function(c){return '<div class="card" data-act="abrir" data-id="'+c.id+'"><div class="row sp"><b>'+esc(c.nome)+'</b><span class="big">'+money(total(c))+'</span></div><div class="mu">Entrada '+hora(c.entrada)+(c.saida?' · Saída '+hora(c.saida)+(c.pg?' · '+FP[c.pg]:''):'')+' · '+c.itens.length+' item(ns)</div></div>'}).join('');
  return h;
}

function detail(c){
  var open=!c.saida,h='<button data-act="voltar">← Voltar</button>';
  h+='<div class="card" style="margin-top:10px"><div class="row sp"><b class="big">'+esc(c.nome)+'</b><span class="big">'+money(total(c))+'</span></div><div class="mu">Entrada '+hora(c.entrada)+(c.saida?' · Saída '+hora(c.saida)+(c.pg?' · Pago em '+FP[c.pg]+(c.rec?' · Recebido '+money(c.rec)+' · Troco '+money(c.rec-total(c)):''):''):'')+'</div>';
  if(!c.itens.length)h+='<p class="mu">Sem consumo ainda.</p>';
  h+=c.itens.map(function(i,k){return '<div class="item row sp"><span>'+esc(i.n)+' <span class="mu">'+money(i.p)+'</span></span><span class="row">'+(open?'<button class="q" data-act="menos" data-k="'+k+'">−</button>':'')+'<b>'+i.q+'</b>'+(open?'<button class="q" data-act="mais" data-k="'+k+'">+</button>':'')+'</span></div>'}).join('');
  if(descv(c)>0)h+='<div class="item row sp mu"><span>Subtotal</span><span>'+money(sub(c))+'</span></div><div class="item row sp"><span>Desconto</span><b>−'+money(descv(c))+'</b></div>';
  h+='</div>';
  if(open){
    h+='<div class="card"><b>Adicionar consumo</b>'+S.cats.map(function(g){var its=S.cat.map(function(i,k){return i.c===g.id?'<button data-act="add" data-k="'+k+'">'+esc(i.n)+' · '+money(i.p)+'</button>':''}).join('');return its?'<div class="mu" style="margin-top:8px">'+esc(g.n)+'</div><div class="chips">'+its+'</div>':''}).join('');
    h+='<div class="row"><input id="cn" placeholder="Item avulso"><input id="cp" inputmode="decimal" placeholder="Preço" style="max-width:100px"><button data-act="avulso">+</button></div></div>';
    if(!paying)h+=descCard(c);
    h+=paying==='din'?cashView(c):paying?'<div class="card"><b>Forma de pagamento</b><p class="mu">Total '+money(total(c))+'</p><div class="row"><button class="pri" style="flex:1" data-act="pagar" data-m="pix">Pix</button><button class="pri" style="flex:1" data-act="pagar" data-m="car">Cartão</button><button class="pri" style="flex:1" data-act="cash">Dinheiro</button></div><button style="width:100%;margin-top:8px" data-act="cancpag">Cancelar</button></div>':'<button class="pri" style="width:100%;margin-bottom:8px" data-act="saida">Dar saída e fechar ('+money(total(c))+')</button>';
  }else h+='<div class="card"><b>Forma de pagamento</b><div class="row" style="margin-top:8px">'+['pix','car','din'].map(function(m){return '<button class="'+(c.pg===m?'pri':'')+'" style="flex:1" data-act="setpg" data-m="'+m+'">'+FP[m]+'</button>'}).join('')+'</div></div><button style="width:100%;margin-bottom:8px" data-act="reabrir">Reabrir comanda</button>';
  h+='<button class="dng" style="width:100%" data-act="excluir">Excluir comanda</button>';
  return h;
}

function isHoje(t){return new Date(t).toDateString()===new Date().toDateString()}
function caixa(){
  var rec=S.c.filter(function(c){return c.saida&&isHoje(c.saida)}).reduce(function(a,c){return a+total(c)},0);
  var sh=S.sai.filter(function(s){return s.tp!=='e'&&isHoje(s.t)}).reduce(function(a,s){return a+s.v},0);
  var en=S.sai.filter(function(s){return s.tp==='e'&&isHoje(s.t)}).reduce(function(a,s){return a+s.v},0);
  var h='<div class="stat"><div><span class="mu">Comandas recebidas</span><div class="big">'+money(rec)+'</div></div><div><span class="mu">Entradas de caixa</span><div class="big">'+money(en)+'</div></div><div><span class="mu">Saídas</span><div class="big">'+money(sh)+'</div></div><div><span class="mu">Saldo do dia</span><div class="big">'+money(rec+en-sh)+'</div></div></div>';
  h+=porForma();

  return '<div class="card"><b>Conta na nuvem</b><p class="mu">'+esc(cur.nome)+(cur.admin?' · Administrador':' · Funcionário')+'</p><button data-act="syncnow">Sincronizar agora</button></div><div class="card"><b>Alterar senha</b><input id="c_n" type="password" placeholder="Nova senha (m\u00edn. 6)" style="margin-top:8px"><button class="pri" style="margin-top:8px" data-act="csenha">Salvar nova senha</button></div><p class="mu" id="amsg"></p>';
}
async function pull(){
  var rows=[],from=0,first=!SY.since;
  var sd=SY.since?new Date(new Date(SY.since).getTime()-60000).toISOString():null;
  for(;;){
    var q=sb.from('registros').select('tipo,id,dados,apagado,atualizado_em').order('atualizado_em',{ascending:true}).order('id',{ascending:true}).range(from,from+999);
    if(sd)q=q.gte('atualizado_em',sd);
    var r=await q;if(r.error)throw r.error;
    rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000;
  }
  if(first&&rows.length&&!S.c.length&&!S.sai.length){S.cat=[];S.cats=[]}
  var L=flat(),ch=false;
  rows.forEach(function(x){
    var k=x.tipo+':'+x.id,l=L[k],m=SY.m[k];
    if(!SY.since||x.atualizado_em>SY.since)SY.since=x.atualizado_em;
    if(l&&(m===undefined||hs(sj(l))!==m))return;
    if(x.apagado){if(l){upLocal(x.tipo,x.id,null);ch=true}delete SY.m[k];return}
    var h=hs(sj(x.dados));
    if(!l||hs(sj(l))!==h){upLocal(x.tipo,x.id,x.dados);ch=true}
    SY.m[k]=h;
  });
  return ch;
}
async function push(){
  var L=flat(),up=[];
  Object.keys(L).forEach(function(k){var h=hs(sj(L[k]));if(SY.m[k]!==h)up.push({k:k,tipo:k[0],id:k.slice(2),dados:L[k],apagado:false,h:h})});
  Object.keys(SY.m).forEach(function(k){if(!L[k])up.push({k:k,tipo:k[0],id:k.slice(2),dados:{},apagado:true})});
  for(var i=0;i<up.length;i+=200){
    var ch=up.slice(i,i+200);
    var r=await sb.from('registros').upsert(ch.map(function(x){return{user_id:SY.uid,tipo:x.tipo,id:x.id,dados:x.dados,apagado:x.apagado}}),{onConflict:'tipo,id'});
    if(r.error)throw r.error;
    ch.forEach(function(x){if(x.apagado)delete SY.m[x.k];else SY.m[x.k]=x.h});
  }
}
async function sync(){
  if(!CLOUD||!cur||!SY.uid)return;
  if(!navigator.onLine){setStat('Offline: dados salvos no aparelho');return}
  if(syncing){syncAgain=true;return}
  syncing=true;setStat('Sincronizando...');
  try{
    var ss=await sb.auth.getSession();
    if(!ss.data.session){
      if(isNetErr(ss.error))throw ss.error;
      try{localStorage.removeItem('comanda_login_v1')}catch(e3){}
      cur=null;wait=null;syncing=false;setStat('');render();return;
    }
    var pf=await checkPerfil();
    if(!pf||pf.status!=='aprovado'){wait=pf?pf.status:'pendente';cur=null;syncing=false;setStat('');render();return}
    cur.admin=!!pf.is_admin;cachePerfil(SY.uid,pf);
    migr();
    var ch=await pull();
    if(cur.admin){var pb=PF.pend;try{await loadPF()}catch(e2){}if(PF.pend!==pb)ch=true}
    await push();
    saveLocal();saveSY();
    setStat('Sincronizado \u00e0s '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    if(ch)softRender();
  }catch(e){setStat('Sem conex\u00e3o com a nuvem: dados salvos no aparelho')}
  syncing=false;
  if(syncAgain){syncAgain=false;schedSync()}
}
function schedSync(){if(!CLOUD)return;clearTimeout(stimer);stimer=setTimeout(sync,1500)}
function savedLogin(){try{return JSON.parse(localStorage.getItem('comanda_login_v1'))}catch(e){return null}}
function isNetErr(e){return !!e&&/Retryable|fetch|network/i.test(String(e.name)+' '+String(e.message))}
function offlineBoot(err){
  var l=savedLogin(),p=l&&cachedPerfil(l.uid);
  booting=false;
  if(l&&p&&p.status==='aprovado'&&(!navigator.onLine||isNetErr(err))){
    SY.uid=l.uid;cur={id:l.uid,nome:l.email,admin:!!p.is_admin};
    render();setStat('Offline: dados salvos no aparelho');return;
  }
  render();
}
function onAuth(s){
  if(!s)return;
  SY.uid=s.user.id;saveSY();
  try{localStorage.setItem('comanda_login_v1',JSON.stringify({uid:s.user.id,email:s.user.email}))}catch(e){}
  sb.from('perfis').select('status,is_admin').eq('id',s.user.id).maybeSingle().then(function(r){
    var p=r.data;
    if(r.error)p=cachedPerfil(s.user.id);else cachePerfil(s.user.id,p);
    booting=false;
    if(p&&p.status==='aprovado'){wait=null;cur={id:s.user.id,nome:s.user.email,admin:!!p.is_admin};render();sync()}
    else{wait=p?p.status:'pendente';cur=null;render()}
  }).catch(function(){booting=false;wait='pendente';cur=null;render()});
}
if(CLOUD){
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  cur=null;
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)onAuth(r.data.session);else offlineBoot(r.error)}).catch(function(e){offlineBoot(e)});
  sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){var p=prompt('Digite a nova senha (m\u00edn. 6 caracteres):');if(p&&p.length>=6)sb.auth.updateUser({password:p}).then(function(){alert('Senha alterada.')})}});
  setInterval(function(){if(!document.hidden)sync()},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
  window.addEventListener('online',sync);
}
function setVis(k,v){var r=document.documentElement.style;if(k==='bg')r.setProperty('--bgop',String(v/100));else{r.setProperty('--cardop',v+'%');r.setProperty('--inop',Math.min(100,v+20)+'%')}}
(function(){try{var a=localStorage.getItem('comanda_bgop2'),b=localStorage.getItem('comanda_cardop2');if(a!==null)setVis('bg',+a);if(b!==null)setVis('card',+b)}catch(e){}})();
function bgCard(){
  var cs=getComputedStyle(document.documentElement);
  var a=Math.round((parseFloat(cs.getPropertyValue('--bgop'))||0.32)*100),b=parseInt(cs.getPropertyValue('--cardop'))||30;
  return '<div class="card"><b>Aparência</b><p class="mu">Visibilidade da logo de fundo</p><input id="bgr" type="range" min="0" max="80" step="1" value="'+a+'"><div class="mu" id="bgv">'+a+'%</div><p class="mu">Visibilidade dos cartões (menor = mais transparente)</p><input id="cdr" type="range" min="0" max="100" step="1" value="'+b+'"><div class="mu" id="cdv">'+b+'%</div></div>';
}
document.addEventListener('input',function(e){
  var id=e.target.id;if(id!=='bgr'&&id!=='cdr')return;
  var v=+e.target.value;
  try{
    if(id==='bgr'){setVis('bg',v);$('bgv').textContent=v+'%';localStorage.setItem('comanda_bgop2',v)}
    else{setVis('card',v);$('cdv').textContent=v+'%';localStorage.setItem('comanda_cardop2',v)}
  }catch(x){}
});
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('inst').hidden=false});
$('inst').addEventListener('click',function(){if(dp){dp.prompt();dp=null;$('inst').hidden=true}});
window.addEventListener('appinstalled',function(){$('inst').hidden=true});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
render();
